name: Bug report
description: Something on makers.lv doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://makers.lv/lv/...
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Android
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the site footer, or the image tag if you self-host.
