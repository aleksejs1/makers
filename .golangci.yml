version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
        - G124 # cookie Secure flag depends on MAKERS_BASE_URL (http in development)
        - G203 # html/template HTML() is used only on sanitized output
        - G710 # redirect targets are local paths (see safeNext)
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aleksejs1/makers
